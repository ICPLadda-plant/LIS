name: Auto PR and Merge
on:
  push:
    branches-ignore: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell
    env:
      GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: เปิด PR เข้า main (ถ้ายังไม่มี PR ที่เปิดอยู่)
        run: |
          $open = gh pr list --repo $env:REPO --head $env:BRANCH --base main --state open --json number --jq '.[0].number'
          if (-not $open) {
            gh pr create --repo $env:REPO --base main --head $env:BRANCH --title "Merge $env:BRANCH into main" --body "สร้างอัตโนมัติเมื่อ push $env:BRANCH"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Merge เข้า main ถ้าไม่มี conflict
        run: |
          gh pr merge $env:BRANCH --repo $env:REPO --merge
          if ($LASTEXITCODE -ne 0) { Write-Error "Merge ไม่ได้ (อาจมี conflict) PR ยังเปิดไว้ให้แก้"; exit 1 }
