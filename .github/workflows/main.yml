name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell
        working-directory: C:\laragon\www\LIS
    steps:
      - name: Pull latest code
        run: git pull origin main

      - name: Install packages
        run: npm install

      - name: Build
        run: npm run build
